<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d1a">
<title>Ask EGSPEC</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">

<script src="/static/vendor/leaflet/leaflet.js" defer></script>




<style>
/* =========================================================
   CampusMind / Ask EGSPEC — Professional Design System
   ========================================================= */

:root {
  /* Official EGSPEC-inspired palette */
  --bg: #050d1a;
  --bg-elevated: #0a1628;
  --panel: #0c1e35;
  --panel-2: #122a45;
  --panel-3: #183552;
  --line: rgba(148, 180, 220, 0.16);
  --line-strong: rgba(148, 180, 220, 0.28);

  --text: #f2f6fb;
  --text-secondary: #a9bdd2;
  --muted: #7d94ad;

  /* Magenta from official EGS PILLAY wordmark */
  --accent: #AF005F;
  --accent-soft: rgba(175, 0, 95, 0.16);
  --accent-hover: #d41472;
  --accent-deep: #8a004c;

  /* Official navy */
  --navy: #0b1f4d;
  --navy-deep: #061530;

  --success: #22c55e;
  --warning: #f59e0b;

  --radius-sm: 10px;
  --radius: 14px;
  --radius-lg: 18px;
  --radius-xl: 22px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.48);

  --font: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  min-width: 320px;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background:
    radial-gradient(ellipse 80% 50% at 85% -10%, rgba(30, 80, 140, 0.22), transparent 55%),
    radial-gradient(ellipse 60% 40% at 10% 100%, rgba(225, 29, 100, 0.06), transparent 50%),
    linear-gradient(180deg, #03101f 0%, #020b16 50%, #010810 100%);
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; }

.app {
  width: min(100%, 1080px);
  min-height: 100dvh;
  margin: 0 auto;
  position: relative;
}

.screen { min-height: 100dvh; }
.hidden { display: none !important; }

/* ========== HEADER ========== */
.header {
  height: 68px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(6, 16, 36, 0.88);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  position: sticky;
  top: 0;
  z-index: 40;
}

.menu, .iconBtn {
  width: 42px;
  height: 42px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text-secondary);
  display: grid;
  place-items: center;
  transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
}

.menu:hover, .iconBtn:hover {
  border-color: var(--line-strong);
  background: var(--panel-2);
  color: var(--text);
}

.menu span {
  width: 17px;
  height: 1.5px;
  background: currentColor;
  display: block;
  margin: 3px auto;
  border-radius: 1px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  min-width: 0;
}

.mark {
  width: 40px;
  height: 40px;
  border: 1px solid rgba(140, 180, 220, 0.28);
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--text);
  background: linear-gradient(145deg, var(--panel-2), var(--panel));
  position: relative;
  flex-shrink: 0;
}

.mark::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  top: 5px;
  right: 5px;
  box-shadow: 0 0 0 2px var(--panel);
}

.brandText strong {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.03em;
  display: block;
}

.brandText small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 1px;
  font-weight: 500;
}

.newBtn {
  width: auto !important;
  padding: 0 14px !important;
  gap: 7px;
  display: flex !important;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text) !important;
}

/* ========== LANDING ========== */
.landing {
  padding: 28px 20px 32px;
  display: flex;
  flex-direction: column;
  min-height: calc(100dvh - 68px);
}

/* Hero */
.heroSplit {
  display: grid !important;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr) !important;
  align-items: end !important;
  gap: 20px !important;
  padding: 36px 4px 24px !important;
  overflow: visible !important;
}

.heroCopy h1 {
  font-size: clamp(52px, 9vw, 88px);
  line-height: 0.92;
  letter-spacing: -0.045em;
  margin: 0;
  font-weight: 800;
  color: var(--text);
}

.heroCopy h1 span {
  display: block;
  color: var(--accent);
}

.underline {
  width: 72px;
  height: 3.5px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-hover));
  margin-top: 18px;
}

.heroVisual {
  position: relative;
  text-align: center;
}

.heroMotto {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--muted);
  margin-bottom: 10px;
  text-transform: uppercase;
}

.heroVisual svg {
  width: 100%;
  max-width: 380px;
  height: auto;
  stroke: #6b9bc7;
  fill: none;
  stroke-width: 1.3;
  opacity: 0.55;
}

.heroVisual svg text {
  fill: #8eb4d4;
  stroke: none;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.12em;
  opacity: 0.7;
}

.heroHand {
  margin-top: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  line-height: 1.35;
  letter-spacing: 0.01em;
}

/* Feature cards */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}

.card {
  position: relative;
  min-height: 118px;
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: linear-gradient(155deg, rgba(14, 36, 56, 0.95), rgba(8, 24, 42, 0.98));
  color: var(--text);
  padding: 16px 16px 14px;
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(225, 29, 100, 0.35);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(225, 29, 100, 0.08);
}

.cardBg {
  position: absolute;
  inset: 0;
  opacity: 0.12;
  pointer-events: none;
  background: radial-gradient(circle at 90% 10%, rgba(140, 180, 220, 0.4), transparent 55%);
}

.cardIcon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--accent-soft);
  display: grid;
  place-items: center;
  color: var(--accent-hover);
  font-size: 18px;
  position: relative;
  z-index: 1;
}

.card:nth-child(even) .cardIcon {
  background: rgba(100, 160, 220, 0.12);
  color: #8ec0f0;
}

.cardFoot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.cardFoot b {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: 0.01em;
}

.arrow {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(225, 29, 100, 0.4);
  display: grid;
  place-items: center;
  font-size: 14px;
  color: var(--accent-hover);
  transition: background 0.2s, color 0.2s;
}

.card:hover .arrow {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.landingSpacer {
  min-height: clamp(100px, 22vh, 260px);
  flex: 1;
}

/* Composer */
.composerWrap {
  position: sticky;
  bottom: 0;
  padding: 12px 0 8px;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}

.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px 8px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--panel);
  box-shadow: var(--shadow);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.composer:focus-within {
  border-color: rgba(225, 29, 100, 0.45);
  box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft);
}

.spark {
  color: var(--accent);
  font-size: 15px;
  flex-shrink: 0;
  opacity: 0.9;
}

.composer input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  padding: 10px 4px;
}

.composer input::placeholder {
  color: var(--muted);
}

.composer .send {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.15s;
}

.composer .send:hover {
  background: var(--accent-hover);
  transform: scale(1.04);
}

/* Voice button */
.voiceBtn {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: #9ec9f5;
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
}

.voiceBtn:hover {
  border-color: rgba(225, 29, 100, 0.45);
  color: #fff;
  transform: translateY(-1px);
}

.voiceBtn.listening {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 0 5px var(--accent-soft);
  animation: voicePulse 1.2s ease-in-out infinite;
}

@keyframes voicePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ========== CHAT SCREEN ========== */
#chatScreen .header { /* same header */ }

.chatLayout {
  display: flex;
  flex-direction: column;
  height: calc(100dvh - 68px);
}

.chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.message {
  display: flex;
  gap: 12px;
  max-width: 92%;
  animation: msgIn 0.28s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.user-message {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.bot-message { align-self: flex-start; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.user-message .avatar {
  background: var(--accent);
  color: #fff;
}

.bot-message .avatar {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: #9ec9f5;
}

.message-content {
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14.5px;
  line-height: 1.55;
  max-width: 100%;
}

.user-message .message-content {
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #fff;
  border-bottom-right-radius: 5px;
}

.bot-message .message-content {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  border-bottom-left-radius: 5px;
}

.message-content p { margin: 0 0 0.55em; }
.message-content p:last-child { margin-bottom: 0; }

.error-message { color: #f87171; }

/* Sources */
.sources, .sourcesPanel {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

.sourcesTitle, .sources strong {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 8px;
  display: block;
}

.sourceCards {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sourceCard {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 12.5px;
}

.sourceCard b {
  display: block;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.sourceCard span {
  color: var(--muted);
  font-size: 11.5px;
}

/* Quick replies */
.quickReplies, #quickReplies {
  padding: 8px 16px 4px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.quickReplies button, #quickReplies button {
  padding: 8px 14px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--text-secondary);
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 0.18s;
}

.quickReplies button:hover, #quickReplies button:hover {
  border-color: rgba(225, 29, 100, 0.4);
  background: var(--accent-soft);
  color: var(--text);
}

/* Typing */
.typing-indicator, #typingIndicator {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 4px 0;
}

.typing-indicator span, #typingIndicator span {
  width: 7px;
  height: 7px;
  background: var(--muted);
  border-radius: 50%;
  animation: bounce 1.3s infinite ease-in-out;
}

.typing-indicator span:nth-child(2), #typingIndicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3), #typingIndicator span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Chat composer area */
.chatComposer {
  padding: 10px 16px 18px;
  border-top: 1px solid var(--line);
  background: rgba(2, 11, 22, 0.9);
  backdrop-filter: blur(12px);
}

/* Visual / map cards */
.visualStack { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

.visualCard {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--panel);
}

.visualCard .map {
  height: 180px;
  background: var(--panel-2);
}

.visualMeta {
  padding: 12px 14px;
}

.visualMeta b {
  display: block;
  font-size: 14px;
  font-weight: 650;
  margin-bottom: 4px;
}

.visualMeta p {
  margin: 0 0 4px;
  font-size: 12.5px;
  color: var(--text-secondary);
}

.visualActions {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

.visualActions a {
  font-size: 12px;
  font-weight: 600;
  color: #8ec0f0;
  text-decoration: none;
}

.visualActions a:hover { text-decoration: underline; }

/* Sidebar / drawer */
.drawer, .sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(300px, 86vw);
  background: var(--bg-elevated);
  border-right: 1px solid var(--line);
  z-index: 50;
  transform: translateX(-105%);
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex;
  flex-direction: column;
  padding: 20px 16px;
  box-shadow: var(--shadow-lg);
}

.drawer.open, .sidebar.open {
  transform: translateX(0);
}

.drawerOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 45;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.drawerOverlay.open {
  opacity: 1;
  pointer-events: auto;
}

/* Voice settings in sidebar */
.voiceSettings {
  margin-top: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(10, 39, 72, 0.4);
}

.voiceSettingsTitle {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: 0.02em;
}

.voiceField {
  display: block;
  color: var(--text-secondary);
  font-size: 12px;
  margin-bottom: 10px;
}

.voiceField span {
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
}

.voiceField select {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--text);
  padding: 0 10px;
  outline: none;
}

.voiceField select:focus {
  border-color: rgba(225, 29, 100, 0.4);
}

.voiceToggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  color: var(--text-secondary);
  font-size: 12px;
}

.voiceToggle input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

.voiceHint {
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  margin-top: 10px;
}

.speakerBtn {
  margin-top: 6px;
  border: 0;
  background: transparent;
  color: #87a9ca;
  font-size: 12px;
  padding: 4px 0;
  cursor: pointer;
}

.speakerBtn:hover { color: var(--text); }

/* Center brand helpers (legacy classes kept) */
.centerBrand {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin: 12px auto 18px;
}

.centerLogo {
  width: min(42vw, 190px);
  height: auto;
}

/* Trust / footer links */
.trust {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 8px;
}

/* Light theme (optional invert path kept for compatibility) */
.light {
  filter: invert(0.92) hue-rotate(180deg);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 640px) {
  .header {
    height: 62px;
    padding: 0 14px;
  }

  .brandText strong { font-size: 14px; }
  .mark { width: 36px; height: 36px; font-size: 10px; }

  .menu, .iconBtn {
    width: 40px;
    height: 40px;
  }

  .newBtn {
    font-size: 0 !important;
    width: 40px !important;
    padding: 0 !important;
  }
  .newBtn span { display: none; }
  .newBtn::before {
    content: "+";
    font-size: 20px;
    font-weight: 500;
  }

  .landing { padding: 20px 14px 24px; }

  .heroSplit {
    grid-template-columns: 1fr !important;
    gap: 16px !important;
    padding: 24px 2px 18px !important;
  }

  .heroCopy h1 { font-size: clamp(48px, 14vw, 68px); }
  .heroVisual svg { max-width: 280px; }

  .card {
    min-height: 108px;
    padding: 14px;
  }

  .cardFoot b { font-size: 13px; }

  .landingSpacer { min-height: 28vh; }

  .voiceBtn {
    width: 42px;
    height: 42px;
    flex-basis: 42px;
  }
}

@media (max-width: 400px) {
  .cards { grid-template-columns: 1fr; }
  .brandText { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* Official EGSPEC logo */
.brandLogoLink {
  display: flex;
  align-items: center;
  text-decoration: none;
  line-height: 0;
}
.brandLogo {
  height: 34px;
  width: auto;
  max-width: min(220px, 52vw);
  object-fit: contain;
  filter: brightness(1.05);
}
@media (max-width: 540px) {
  .brandLogo {
    height: 28px;
    max-width: 160px;
  }
}


.chatHeader{
  height:62px;padding:0 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
  background:rgba(6,16,36,.9);backdrop-filter:blur(16px);
  position:sticky;top:0;z-index:30;
}
.chatHeader .back{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:18px;
  display:grid;place-items:center;
}
.chatTitle{flex:1;min-width:0}
.chatTitle strong{display:block;font-size:15px;font-weight:700}
.chatTitle span{font-size:11px;color:var(--muted)}

<script>
const $=s=>document.querySelector(s);
const home=$('#homeScreen'), chat=$('#chatScreen'), chatBody=$('#chatBody');
const homeInput=$('#homeInput'), chatInput=$('#chatInput');
const voiceLanguage=$('#voiceLanguage'), voiceReplyToggle=$('#voiceReplyToggle');
let conversationId = localStorage.getItem('egspecConversationId') || ('c_'+Date.now());
let recognition = null;
let currentSpeech = null;
let lastReplyLanguage = 'en';
let voiceStream = null;

const VOICE_LOCALES = {
  en:'en-IN', ta:'ta-IN', hi:'hi-IN', te:'te-IN', ml:'ml-IN', kn:'kn-IN',
  tanglish:'en-IN', auto:'en-IN'
};

function detectScriptLanguage(text){
  text = text || '';
  if(/[\u0B80-\u0BFF]/.test(text)) return 'ta';
  if(/[\u0900-\u097F]/.test(text)) return 'hi';
  if(/[\u0C00-\u0C7F]/.test(text)) return 'te';
  if(/[\u0D00-\u0D7F]/.test(text)) return 'ml';
  if(/[\u0C80-\u0CFF]/.test(text)) return 'kn';
  return 'en';
}
function preferredLanguageFor(text=''){
  const selected = voiceLanguage?.value || 'auto';
  return selected === 'auto' ? detectScriptLanguage(text) : selected;
}
function recognitionLocale(text=''){
  return VOICE_LOCALES[preferredLanguageFor(text)] || 'en-IN';
}
function chooseIndianVoice(locale){
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices() || [];
  const lower = locale.toLowerCase();
  let matches = voices.filter(v => (v.lang || '').toLowerCase() === lower);
  if(!matches.length){
    const prefix = lower.split('-')[0];
    matches = voices.filter(v => (v.lang || '').toLowerCase().startsWith(prefix));
  }
  if(!matches.length && locale !== 'en-IN'){
    matches = voices.filter(v => (v.lang || '').toLowerCase() === 'en-in');
  }
  matches.sort((a,b)=>{
    const score = v => /google|microsoft|india|indian|natural/i.test(v.name||'') ? 1 : 0;
    return score(b)-score(a);
  });
  return matches[0] || null;
}
function stopSpeaking(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  currentSpeech = null;
}
function speakReply(text, language){
  if(!voiceReplyToggle?.checked || !text || !('speechSynthesis' in window)) return;
  stopSpeaking();
  const code = (language && language !== 'auto') ? language : detectScriptLanguage(text);
  const locale = VOICE_LOCALES[code] || 'en-IN';
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = locale;
  const voice = chooseIndianVoice(locale);
  if(voice) utter.voice = voice;
  utter.rate = 0.96;
  utter.pitch = 1.0;
  utter.volume = 1.0;
  currentSpeech = utter;
  speechSynthesis.speak(utter);
}
function startBrowserVoiceInput(targetInput, button){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    const msg='Voice input is not supported in this browser. Chrome on Android usually supports it.';
    if($('#voiceHint')) $('#voiceHint').textContent=msg;
    return;
  }
  if(recognition){ recognition.stop(); return; }
  stopSpeaking();
  recognition = new SR();
  recognition.lang = recognitionLocale(targetInput.value);
  recognition.interimResults = true;
  recognition.continuous = false;
  button.classList.add('listening');
  if($('#voiceHint')) $('#voiceHint').textContent='Listening… speak now.';
  recognition.onresult = e => {
    let text='';
    for(let i=e.resultIndex;i<e.results.length;i++) text += e.results[i][0].transcript;
    targetInput.value=text.trim();
  };
  recognition.onerror = () => {
    if($('#voiceHint')) $('#voiceHint').textContent='Voice input stopped. Try again or change the language.';
  };
  recognition.onend = () => {
    button.classList.remove('listening');
    recognition=null;
    if($('#voiceHint')) $('#voiceHint').textContent='Indian voice is selected automatically when available on this device.';
    targetInput.focus();
  };
  recognition.start();
}

function downsamplePCM16(input,inputRate,outputRate=16000){
  if(outputRate>=inputRate){
    const out=new Int16Array(input.length);
    for(let i=0;i<input.length;i++) out[i]=Math.max(-32768,Math.min(32767,input[i]*32767));
    return out;
  }
  const ratio=inputRate/outputRate, length=Math.round(input.length/ratio),out=new Int16Array(length);
  let pos=0;
  for(let i=0;i<length;i++){
    const next=Math.round((i+1)*ratio);let sum=0,count=0;
    for(;pos<next&&pos<input.length;pos++){sum+=input[pos];count++}
    out[i]=Math.max(-32768,Math.min(32767,(sum/Math.max(count,1))*32767));
  }
  return out;
}
async function stopVoiceStream(){
  if(!voiceStream)return;
  const state=voiceStream;voiceStream=null;
  state.processor.disconnect();state.source.disconnect();state.tracks.forEach(t=>t.stop());
  if(state.context.state!=='closed')await state.context.close();
  if(state.socket.readyState===WebSocket.OPEN)state.socket.send(JSON.stringify({type:'stop'}));
  state.button.classList.remove('listening');
  if($('#voiceHint'))$('#voiceHint').textContent='Processing your voice…';
}
async function startVoiceInput(targetInput,button){
  if(voiceStream){await stopVoiceStream();return}
  if(!navigator.mediaDevices?.getUserMedia || !window.WebSocket){startBrowserVoiceInput(targetInput,button);return}
  stopSpeaking();
  try{
    const media=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const context=new (window.AudioContext||window.webkitAudioContext)();
    const source=context.createMediaStreamSource(media),processor=context.createScriptProcessor(4096,1,1);
    const mute=context.createGain();mute.gain.value=0;source.connect(processor);processor.connect(mute);mute.connect(context.destination);
    const scheme=location.protocol==='https:'?'wss':'ws';
    const token=localStorage.getItem('campusmind_access_token')||'';
    const socket=new WebSocket(`${scheme}://${location.host}/api/v1/voice/stream`);
    socket.binaryType='arraybuffer';let audioParts=[],audioMime='audio/mpeg',typing=null,answer='';
    voiceStream={socket,context,source,processor,tracks:media.getTracks(),button,targetInput};
    button.classList.add('listening');if($('#voiceHint'))$('#voiceHint').textContent='Connecting secure live voice…';
    socket.onopen=()=>socket.send(JSON.stringify({type:'start',sample_rate:16000,language:voiceLanguage?.value||'auto',session_id:conversationId,token}));
    processor.onaudioprocess=e=>{
      if(socket.readyState!==WebSocket.OPEN)return;
      const pcm=downsamplePCM16(e.inputBuffer.getChannelData(0),context.sampleRate,16000);socket.send(pcm.buffer);
    };
    socket.onmessage=e=>{
      if(e.data instanceof ArrayBuffer){audioParts.push(e.data);return}
      const data=JSON.parse(e.data);
      if(data.event==='ready' && $('#voiceHint'))$('#voiceHint').textContent='Listening live… tap again to stop.';
      if(data.event==='partial_transcript'){targetInput.value=data.text;if($('#voiceHint'))$('#voiceHint').textContent='Hearing: '+data.text}
      if(data.event==='final_transcript'){
        targetInput.value='';showChat();addMessage(data.text,'user');typing=addTyping();
      }
      if(data.event==='answer_chunk')answer+=data.text;
      if(data.event==='answer_complete'){
        if(typing)typing.remove();lastReplyLanguage=data.language||'en';
        const answerUi=createAnswerRow();answerUi.bubble.textContent=data.answer||answer;
        (data.visuals||[]).forEach(visual=>renderVisual(answerUi.stack,visual));renderSources(answerUi.stack,data.sources);
        const replay=document.createElement('button');replay.className='speakerBtn';replay.type='button';replay.textContent='Play voice';replay.onclick=()=>speakReply(data.answer||answer,lastReplyLanguage);answerUi.stack.appendChild(replay);
        if($('#voiceHint'))$('#voiceHint').textContent='Answer ready.';
      }
      if(data.event==='audio_start'){audioParts=[];audioMime=data.mime_type||'audio/mpeg'}
      if(data.event==='audio_end'&&audioParts.length){const url=URL.createObjectURL(new Blob(audioParts,{type:audioMime}));const player=new Audio(url);player.onended=()=>URL.revokeObjectURL(url);player.play().catch(()=>{});}
      if(data.event==='no_speech'||data.event==='error'||data.event==='tts_unavailable'){
        if($('#voiceHint'))$('#voiceHint').textContent=data.detail||'Voice processing unavailable.';
      }
      if(data.event==='done')socket.close();
    };
    socket.onclose=async()=>{
      if(voiceStream&&voiceStream.socket===socket){const state=voiceStream;voiceStream=null;state.processor.disconnect();state.source.disconnect();state.tracks.forEach(t=>t.stop());if(state.context.state!=='closed')await state.context.close();}
      button.classList.remove('listening');
    };
    socket.onerror=()=>{if($('#voiceHint'))$('#voiceHint').textContent='Server voice unavailable; using browser voice input.';stopVoiceStream().then(()=>startBrowserVoiceInput(targetInput,button));};
  }catch(e){if($('#voiceHint'))$('#voiceHint').textContent='Microphone permission or voice server unavailable.';startBrowserVoiceInput(targetInput,button)}
}

function showChat(){
  home.classList.add('hidden');
  chat.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'instant'});
  setTimeout(()=>chatInput.focus(),80);
}
function showHome(){
  chat.classList.add('hidden');
  home.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'instant'});
}
function addMessage(text,type){
  const row=document.createElement('div');
  row.className='messageRow '+type;
  if(type==='assistant'){
    const av=document.createElement('div');
    av.className='avatar'; av.textContent='EGS'; row.appendChild(av);
  }
  const bubble=document.createElement('div');
  bubble.className='bubble'; bubble.textContent=text; row.appendChild(bubble);
  if(type==='assistant'){
    const replay=document.createElement('button');
    replay.className='speakerBtn'; replay.type='button'; replay.textContent='Play voice';
    replay.onclick=()=>speakReply(text,lastReplyLanguage);
    const holder=document.createElement('div'); holder.appendChild(bubble); holder.appendChild(replay);
    row.replaceChild(holder,bubble);
  }
  chatBody.appendChild(row);
  requestAnimationFrame(()=>row.scrollIntoView({behavior:'smooth',block:'end'}));
  return row;
}
function addTyping(){
  const row=document.createElement('div');
  row.className='messageRow assistant';
  row.innerHTML='<div class="avatar">EGS</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chatBody.appendChild(row);
  row.scrollIntoView({behavior:'smooth',block:'end'});
  return row;
}
function createAnswerRow(){
  const row=document.createElement('div'); row.className='messageRow assistant';
  const av=document.createElement('div'); av.className='avatar'; av.textContent='EGS';
  const stack=document.createElement('div'); stack.className='answerStack';
  const bubble=document.createElement('div'); bubble.className='bubble'; stack.appendChild(bubble);
  row.append(av,stack); chatBody.appendChild(row);
  return {row,stack,bubble};
}
function safeExternalUrl(value){
  try{const url=new URL(value);return url.protocol==='https:'?url.href:null}catch(_){return null}
}
function renderVisual(stack,visual){
  if(!visual||!['map','map_link'].includes(visual.type))return;
  const card=document.createElement('section'); card.className='visualCard';
  if(visual.type==='map'&&window.L){
    const canvas=document.createElement('div'); canvas.className='mapCanvas'; card.appendChild(canvas);
    requestAnimationFrame(()=>{
      const map=L.map(canvas,{scrollWheelZoom:false}).setView([visual.latitude,visual.longitude],visual.zoom||16);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
      const icon=L.divIcon({className:'',html:'<div class="campusPulseMarker"></div>',iconSize:[18,18],iconAnchor:[9,9]});
      L.marker([visual.latitude,visual.longitude],{icon}).addTo(map).bindPopup(visual.title||'Campus').openPopup();
      setTimeout(()=>map.invalidateSize(),0);
    });
  }
  const meta=document.createElement('div'); meta.className='visualMeta';
  const title=document.createElement('b'); title.textContent=visual.title||'Campus location';
  const address=document.createElement('p'); address.textContent=visual.address||'';
  meta.append(title,address);
  if(visual.verification_note){const note=document.createElement('p');note.textContent=visual.verification_note;meta.appendChild(note)}
  const actions=document.createElement('div'); actions.className='visualActions';
  [['Open map',visual.map_url],['Official source',visual.source_url]].forEach(([label,value])=>{
    const href=safeExternalUrl(value); if(!href)return;
    const link=document.createElement('a'); link.href=href; link.target='_blank'; link.rel='noopener noreferrer'; link.textContent=label; actions.appendChild(link);
  });
  if(actions.children.length)meta.appendChild(actions);
  card.appendChild(meta); stack.appendChild(card);
}
function renderSources(stack,sources){
  if(!Array.isArray(sources)||!sources.length)return;
  const panel=document.createElement('section'); panel.className='sourcesPanel';
  const heading=document.createElement('div'); heading.className='sourcesTitle'; heading.textContent='Verified answer sources'; panel.appendChild(heading);
  const cards=document.createElement('div'); cards.className='sourceCards';
  sources.forEach(source=>{
    const card=document.createElement('div'); card.className='sourceCard';
    const name=document.createElement('b'); name.textContent=source.document||'Institute document';
    const detail=document.createElement('span');
    const score=Number(source.relevance_score); detail.textContent=`Page ${source.page??'-'}${Number.isFinite(score)?` · ${Math.round(score*100)}% match`:''}`;
    card.append(name,detail); cards.appendChild(card);
  });
  panel.appendChild(cards); stack.appendChild(panel);
}
function parseSseBlock(block){
  let event='message',data='';
  block.split('\n').forEach(line=>{if(line.startsWith('event:'))event=line.slice(6).trim();if(line.startsWith('data:'))data+=line.slice(5).trim()});
  try{return {event,data:JSON.parse(data)}}catch(_){return {event,data:null}}
}
async function sendQuestion(q){
  q=(q||'').trim(); if(!q)return;
  showChat();
  addMessage(q,'user');
  const typing=addTyping();

  const history=JSON.parse(localStorage.getItem('egspecQuestions')||'[]');
  history.push(q); localStorage.setItem('egspecQuestions',JSON.stringify(history.slice(-30)));

  try{
    const res=await fetch('/api/v1/chat/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:q,
        session_id:conversationId,
        language:(voiceLanguage?.value || 'auto')
      })
    });
    if(!res.ok) throw new Error('backend');
    if(!res.body)throw new Error('stream');
    typing.remove();
    const answerUi=createAnswerRow();
    const reader=res.body.getReader(),decoder=new TextDecoder(); let buffer='',answer='',complete=null,pendingVisuals=[];
    while(true){
      const {value,done}=await reader.read(); buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});
      const blocks=buffer.split('\n\n'); buffer=blocks.pop()||'';
      for(const block of blocks){
        const message=parseSseBlock(block); if(!message.data)continue;
        if(message.event==='token'){answer+=message.data.text||'';answerUi.bubble.textContent=answer;answerUi.row.scrollIntoView({behavior:'smooth',block:'end'})}
        if(message.event==='visual')pendingVisuals.push(message.data);
        if(message.event==='complete')complete=message.data;
        if(message.event==='error')throw new Error(message.data.detail||'backend');
      }
      if(done)break;
    }
    complete=complete||{}; answer=complete.answer||answer||'No answer returned.'; answerUi.bubble.textContent=answer;
    (pendingVisuals.length?pendingVisuals:(complete.visuals||[])).forEach(visual=>renderVisual(answerUi.stack,visual)); renderSources(answerUi.stack,complete.sources);
    lastReplyLanguage=complete.language||preferredLanguageFor(answer);
    const replay=document.createElement('button'); replay.className='speakerBtn'; replay.type='button'; replay.textContent='Play voice'; replay.onclick=()=>speakReply(answer,lastReplyLanguage); answerUi.stack.appendChild(replay);
    speakReply(answer,lastReplyLanguage);
  }catch(e){
    setTimeout(()=>{
      typing.remove();
      addMessage('Preview mode is active. Run the full EGSPEC project to connect live chatbot answers.','assistant');
    },500);
  }
}

$('#homeForm').addEventListener('submit',e=>{
  e.preventDefault();
  const q=homeInput.value; homeInput.value=''; sendQuestion(q);
});
$('#chatForm').addEventListener('submit',e=>{
  e.preventDefault();
  const q=chatInput.value; chatInput.value=''; sendQuestion(q);
});
document.querySelectorAll('[data-question]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    $('#drawer').classList.remove('open');
    sendQuestion(btn.dataset.question);
  });
});
$('#backBtn').onclick=()=>{stopSpeaking();showHome()};
function newChat(){
  stopSpeaking();
  conversationId='c_'+Date.now();
  localStorage.setItem('egspecConversationId',conversationId);
  chatBody.innerHTML='';
  homeInput.value=''; chatInput.value='';
  showHome();
}
$('#homeNewBtn').onclick=newChat;
$('#chatNewBtn').onclick=newChat;
$('#menuBtn').onclick=()=>$('#drawer').classList.add('open');
$('#drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};
$('#homeVoiceBtn').onclick=()=>startVoiceInput(homeInput,$('#homeVoiceBtn'));
$('#chatVoiceBtn').onclick=()=>startVoiceInput(chatInput,$('#chatVoiceBtn'));

const savedLang=localStorage.getItem('egspec-language')||'auto';
if(voiceLanguage) voiceLanguage.value=savedLang;
if(voiceLanguage) voiceLanguage.onchange=()=>localStorage.setItem('egspec-language',voiceLanguage.value);
const savedVoice=localStorage.getItem('egspec-voice-replies');
if(savedVoice!==null && voiceReplyToggle) voiceReplyToggle.checked=savedVoice==='true';
if(voiceReplyToggle) voiceReplyToggle.onchange=()=>{
  localStorage.setItem('egspec-voice-replies',String(voiceReplyToggle.checked));
  if(!voiceReplyToggle.checked) stopSpeaking();
};
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
  speechSynthesis.getVoices();
}
$('#themeBtn').onclick=()=>document.body.classList.toggle('light');
</script>
</body>
